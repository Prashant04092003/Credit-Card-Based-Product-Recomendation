services:
  credit360:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit360-enterprise
    ports:
      # Defaults to 8080 on host to prevent conflicts with local development server on 8000
      - "${HOST_PORT:-8080}:8000"
    volumes:
      # Mount data folder containing DuckDB and master parquet
      - ./data:/app/data
      # Mount backend source code for live hot-reloads and instant updates
      - ./backend:/app/backend
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
