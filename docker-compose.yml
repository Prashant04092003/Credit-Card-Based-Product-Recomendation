version: '3.8'

services:
  credit360:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit360-enterprise
    ports:
      - "8000:8000"
    volumes:
      # Mount data folder containing DuckDB and master parquet
      - ./data:/app/data
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
